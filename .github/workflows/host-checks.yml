name: Cross-platform host checks
on:
  workflow_dispatch:
  push:
    paths: ['runtime/**', 'preview/**', 'scripts/**', 'app/src/main/java/dev/pocket/agent/*.java', '.github/workflows/host-checks.yml']
  pull_request:
    paths: ['runtime/**', 'preview/**', 'scripts/**', 'app/src/main/java/dev/pocket/agent/*.java', '.github/workflows/host-checks.yml']
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r scripts/requirements-dev.txt
      - run: npm ci --ignore-scripts
        working-directory: runtime
      - run: npm test
        working-directory: runtime
      - name: Diagnose Windows private-file ownership
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'pocket-private-owner-probe'
          New-Item -ItemType Directory -Path $probe -Force | Out-Null
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $acl = Get-Acl -LiteralPath $probe
          [pscustomobject]@{
            Caller = $identity.User.Value
            TokenDefaultOwner = $identity.Owner.Value
            NewDirectoryOwner = $acl.GetOwner([Security.Principal.SecurityIdentifier]).Value
          } | ConvertTo-Json
          powershell.exe -NoProfile -NonInteractive -Command 'Get-ExecutionPolicy -List | Format-Table -AutoSize'
      - run: npm run test:ui
        working-directory: runtime
      - run: npm run build
        working-directory: runtime
      - run: python -m unittest discover -s scripts -p "test_*.py" -v
