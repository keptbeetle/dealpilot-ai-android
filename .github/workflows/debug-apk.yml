name: Downloadable Android APKs

on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check runtime and browser companion
        working-directory: runtime
        run: npm ci --no-audit --no-fund && npm test && npm run test:ui && npm run build
      - name: Check host protocols and lifecycle
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements-dev.txt
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Restore optional update-compatible debug key (never on PRs)
        if: github.event_name != 'pull_request'
        env:
          CI_DEBUG_KEYSTORE_BASE64: ${{ secrets.CI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = os.environ.get('CI_DEBUG_KEYSTORE_BASE64', '')
          if encoded:
              key = Path(os.environ['RUNNER_TEMP']) / 'pocket-ci-debug.keystore'
              key.write_bytes(base64.b64decode(encoded, validate=True))
              key.chmod(0o600)
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  env.write(f'CI_DEBUG_KEYSTORE={key}\n')
          PY
      - name: Build installable debug APKs and lint
        run: ./gradlew --no-daemon -PciBuildNumber="$GITHUB_RUN_NUMBER" :app:assembleDebug :app:lintDebug
      - name: Verify APK signatures and payloads
        run: |
          for apk in app/build/outputs/apk/debug/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          done > app/build/outputs/apk/debug/signatures.txt
          python scripts/check_apk.py app/build/outputs/apk/debug/*.apk > app/build/outputs/apk/debug/payload-report.jsonl
          python scripts/collect_ci_apks.py --output artifacts/ci-apks
      - name: Upload ARM64 phone APK
        id: arm64
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Pocket-Agent-arm64-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/ci-apks/arm64/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Upload x86-64 emulator APK
        id: x86
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Pocket-Agent-x86_64-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/ci-apks/x86_64/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Upload universal APK
        id: universal
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Pocket-Agent-universal-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/ci-apks/universal/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Show download links
        env:
          ARM64_URL: ${{ steps.arm64.outputs.artifact-url }}
          X86_URL: ${{ steps.x86.outputs.artifact-url }}
          UNIVERSAL_URL: ${{ steps.universal.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Download this build\n\n')
              for label, key in [('ARM64 — most Android phones', 'ARM64_URL'), ('x86-64 — Android emulator', 'X86_URL'), ('Universal — both architectures', 'UNIVERSAL_URL')]:
                  summary.write(f'- [{label}]({os.environ[key]})\n')
              summary.write('\nDownload the ZIP, extract the APK, and install it. Artifacts expire after seven days.\n\n')
              summary.write(Path('artifacts/ci-apks/BUILD.md').read_text())
          PY
      - name: Preserve lint diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: APK-lint-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/reports/lint-results-debug.*
          retention-days: 3
          if-no-files-found: ignore
      - name: Remove private debug signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/pocket-ci-debug.keystore"
